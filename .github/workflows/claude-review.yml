name: Claude review

# A reviewer for what CI cannot see. The other workflows check lint, types,
# tests, data integrity and a11y; this reads the diff for the things only a
# reader catches: a claim its source does not support, text that slides into
# operational advice, English that drifts from its Japanese, a figure line that
# pierces a box. It reviews, it does not gate: nothing here is a required check.
#
# The action refuses to run when this file differs from the copy on the default
# branch, so a pull request cannot rewrite its own reviewer. The cost is that a
# change to this file goes unreviewed by Claude until it is merged.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# One review per pull request; a rapid re-push cancels the superseded run.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review the diff
    # Forks and Dependabot get no Actions secrets, so the run would fail on auth
    # rather than say anything useful; drafts wait until marked ready.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # post the summary and inline findings
      issues: read # the delivery check reads conversation comments
      id-token: write # the action's default GitHub App auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Without the token the action exits green having reviewed nothing, which
      # looks reviewed but is not. Fail here, where the reason is legible.
      - name: Require the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token', then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      # Anything the review posts must be newer than this, or it is a leftover
      # from an earlier push. Two minutes absorbs runner/API clock skew.
      - name: Mark the start of this review
        id: started
        run: echo "at=$(date -u -d '-2 minutes' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        id: claude
        with:
          # A subscription token, not an API key (runs against the Claude plan).
          # Generate it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            weakest-layer is a bilingual (English default, Japanese at /ja/) static Astro site that
            explains how attackers hide who they are, layer by layer, and which layer gave way
            in documented cases. Read README.md and research/design.md first for the invariants.

            Do not repeat what a linter, tsc, vitest or axe would catch — CI already runs
            Biome, astro check, Vitest, markdownlint, a data-integrity script (citations exist,
            en/ja structural parity, no Japanese in English) and Playwright+axe.
            Look for what only a reader can catch:

            1. Claims vs sources. Every number, date and name in src/content/layers/** and
               src/data/cases.json must be supported by the source it cites
               (src/data/sources/*.json). A claim stronger than its source, a disputed account
               presented as settled, a date or figure that does not match, or a journalism
               source used where the primary record exists is a defect. Open the cited URL if
               you can.

            2. Scope. The site explains mechanisms and failure modes. Flag any text or figure
               that reads as operational guidance for staying hidden or evading investigators:
               setup steps, configurations, tool recommendations, "do X to avoid Y" advice.

            3. EN/JA meaning. The validator checks structure, not meaning. Flag English that
               drifts in meaning from the Japanese (or the reverse), translationese Japanese,
               or a change made in one language only.

            4. Figures. Inline SVG (`<svg class="dg">`) must not let a line pierce a box or
               text overlap text; arrowheads must not sit inside boxes; SVG attributes must be
               kebab-case; colour carries meaning only (black = hidden, yellow = readable,
               magenta = points at the person). The observer model (src/lib/vantage.ts) must
               stay consistent with the network chapter.

            5. Prose that outruns the build: a README or design line promising behaviour the
               code does not have.

            Do not sign anything you post. No "Generated with" footer, no co-authored-by line,
            no self-attribution, in any comment. The review stands on the findings.

            Post findings as inline comments on the lines they concern, one top-level comment
            for the summary, each citing file:line. If the diff is clean against all of the
            above, say so in one line rather than manufacturing nits.

            Write the summary to a file and post it with `gh pr comment --body-file <path>`.
            A body built inline from a heredoc or command substitution does not match the
            allowlist and is refused, which loses the whole review.

          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Write,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Report the review outcome
        if: always()
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          echo "action conclusion: '${CONCLUSION}'"
          echo "execution file:    '${EXECUTION_FILE}'"
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            jq -r '[.. | objects | select(.type? == "result") | .permission_denials?]
              | map(select(. != null)) | last // [] | .[]
              | "denied: \(.tool_name // "?") \(.tool_input | tojson | .[0:200])"' \
              "$EXECUTION_FILE" 2>/dev/null || true
          fi

      # A review that runs, is refused a tool call on the way to posting, and
      # exits green leaves the PR unreviewed behind a passing check. Silence
      # alone is fine (nothing to add); silence WITH a refusal is the failure.
      - name: Fail on a review that was not delivered
        if: always() && steps.claude.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.started.outputs.at }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          BOT: claude[bot]
        run: |
          set -euo pipefail
          fresh() {
            gh api --paginate "$1" --jq \
              "[.[] | select(.user.login == \"$BOT\") | select((.$2 // \"\") >= \"$SINCE\")] | length" |
              awk '{ n += $1 } END { print n + 0 }'
          }
          summary=$(fresh "repos/$REPO/issues/$PR/comments" updated_at)
          inline=$(fresh "repos/$REPO/pulls/$PR/comments" updated_at)
          reviews=$(fresh "repos/$REPO/pulls/$PR/reviews" submitted_at)
          total=$((summary + inline + reviews))
          echo "posted since $SINCE: $summary summary, $inline inline, $reviews review(s)"
          if [ "$total" -gt 0 ]; then
            exit 0
          fi
          denials=unknown
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            denials=$(jq -r '[.. | objects | select(.type? == "result") | .permission_denials_count?]
              | map(select(. != null)) | last // 0' "$EXECUTION_FILE" 2>/dev/null || echo unknown)
          fi
          echo "denied tool calls: $denials"
          if [ "$denials" = "0" ]; then
            echo "::notice::The review posted nothing and nothing was refused, so it had nothing to add."
            exit 0
          fi
          echo "::error::The review ran, was refused a tool call ($denials), and posted nothing. Widen --allowedTools above."
          exit 1
